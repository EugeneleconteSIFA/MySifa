<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MySifa — Maquette mobile portrait : MyAO et Coûts matières</title>
<style>
/* ══════════════════════════════════════════════════════════════════════
   Tokens MySifa — copiés de static/mysifa_theme.css (source unique).
   Aucune couleur en dur ailleurs dans ce fichier.
   ══════════════════════════════════════════════════════════════════════ */
:root{
  --bg:#0a0e17;--card:#111827;--border:#1e293b;--text:#f1f5f9;--text2:#cbd5e1;
  --muted:#94a3b8;--accent:#22d3ee;--accent-bg:rgba(34,211,238,0.12);
  --filter-input-bg:#1c2838;
  --success:#34d399;--warn:#fbbf24;--danger:#f87171;
  --c1:#22d3ee;--c2:#a78bfa;--c3:#34d399;--c4:#fbbf24;--c5:#f87171;
}
body.light{
  --bg:#f1f5f9;--card:#ffffff;--border:#e2e8f0;--text:#0f172a;--text2:#475569;
  --muted:#94a3b8;--accent:#0891b2;--accent-bg:rgba(8,145,178,0.10);
  --filter-input-bg:#ffffff;
  --success:#059669;--warn:#d24b00;--danger:#dc2626;
  --c1:#0891b2;--c2:#7c3aed;--c3:#059669;--c4:#d97706;--c5:#dc2626;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
}

/* ── Chrome de la maquette (hors application) ───────────────────────── */
.mq-top{
  position:sticky;top:0;z-index:60;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:12px 20px;background:var(--card);border-bottom:1px solid var(--border);
}
.mq-brand{font-size:15px;font-weight:800;letter-spacing:-.3px}
.mq-brand span{color:var(--accent)}
.mq-top-sub{font-size:11.5px;color:var(--muted);flex:1;min-width:160px}
.mq-tgl{
  display:inline-flex;gap:4px;background:var(--bg);border:1px solid var(--border);
  border-radius:10px;padding:3px;
}
.mq-tgl button{
  min-height:32px;padding:0 12px;border:0;border-radius:8px;background:transparent;
  color:var(--muted);font:600 12px/1 inherit;cursor:pointer;
}
.mq-tgl button.on{background:var(--accent-bg);color:var(--accent);font-weight:700}

.mq-wrap{display:flex;gap:26px;align-items:flex-start;padding:22px 20px 60px;max-width:1500px;margin:0 auto}

/* Sommaire */
.mq-toc{
  position:sticky;top:78px;width:264px;flex:0 0 264px;
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:14px;max-height:calc(100dvh - 110px);overflow-y:auto;
}
.mq-toc h3{
  margin:12px 0 7px;font-size:10.5px;font-weight:800;letter-spacing:.09em;
  text-transform:uppercase;color:var(--muted);
}
.mq-toc h3:first-child{margin-top:0}
.mq-toc button{
  display:block;width:100%;text-align:left;margin-bottom:3px;
  min-height:36px;padding:7px 11px;border-radius:9px;
  border:1px solid transparent;background:var(--bg);color:var(--text2);
  font:600 12.5px/1.35 inherit;cursor:pointer;
}
.mq-toc button:hover{border-color:var(--border);color:var(--text)}
.mq-toc button.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent);font-weight:700}
.mq-toc em{display:block;font-style:normal;font-size:10.5px;color:var(--muted);font-weight:500;margin-top:2px}
.mq-toc button.on em{color:var(--accent)}

/* Scène */
.mq-scene{flex:1;min-width:0;display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap}

/* Téléphone : 390 × 844 (iPhone 14 / Pixel 7, le format de référence). */
.mq-phone{
  flex:0 0 auto;width:390px;height:844px;position:relative;
  background:var(--bg);border:10px solid var(--border);border-radius:44px;
  box-shadow:0 26px 60px rgba(0,0,0,.34);overflow:hidden;
}
.mq-notch{
  position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:132px;height:26px;background:var(--border);
  border-radius:0 0 16px 16px;z-index:50;
}
.mq-status{
  height:34px;display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 20px 3px;font:700 11.5px/1 inherit;color:var(--text2);
  background:var(--bg);position:relative;z-index:40;
}
.mq-screen{
  position:absolute;inset:34px 0 0 0;overflow-y:auto;overflow-x:hidden;
  background:var(--bg);scrollbar-width:thin;
}
.mq-screen::-webkit-scrollbar{width:5px}
.mq-screen::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* Notes de conception à droite du téléphone */
.mq-notes{flex:1;min-width:280px;max-width:520px}
.mq-notes h2{margin:0 0 4px;font-size:19px;font-weight:800;letter-spacing:-.4px}
.mq-notes .mq-route{
  display:inline-block;margin-bottom:14px;padding:3px 9px;border-radius:6px;
  background:var(--accent-bg);color:var(--accent);
  font:700 11px/1.5 ui-monospace,'Cascadia Code',monospace;
}
.mq-note{
  background:var(--card);border:1px solid var(--border);border-left:3px solid var(--accent);
  border-radius:0 12px 12px 0;padding:12px 14px;margin-bottom:10px;
}
.mq-note b{display:block;font-size:13px;margin-bottom:4px}
.mq-note p{margin:0;font-size:12.5px;line-height:1.6;color:var(--text2)}
.mq-note--pb{border-left-color:var(--warn)}
.mq-note--pb b{color:var(--warn)}

/* ══════════════════════════════════════════════════════════════════════
   Socle mobile .msf- — repris de static/mysifa_mobile.css
   ══════════════════════════════════════════════════════════════════════ */
.msf-tap{min-width:44px;min-height:44px}
.msf-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 13px}
.msf-card + .msf-card{margin-top:9px}
.msf-card-head{display:flex;align-items:center;gap:8px;margin-bottom:7px;min-width:0}
.msf-card-title{flex:1;min-width:0;font-size:14.5px;font-weight:700;letter-spacing:-.2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msf-card-sub{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:11.5px;color:var(--muted)}
.msf-card-sub + .msf-card-sub{margin-top:5px}
.msf-chevron{flex:0 0 auto;color:var(--muted);display:inline-flex}

.msf-rows{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.msf-row{display:flex;align-items:center;gap:11px;min-height:52px;padding:8px 12px;
  border-bottom:1px solid var(--border);background:none;border-left:0;border-right:0;border-top:0;
  width:100%;text-align:left;color:inherit;font:inherit;cursor:pointer}
.msf-row:last-child{border-bottom:0}
.msf-row-ico{width:32px;height:32px;flex:0 0 32px;border-radius:9px;
  background:var(--accent-bg);color:var(--accent);display:flex;align-items:center;justify-content:center}
.msf-row-ico--warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.msf-row-ico--danger{background:color-mix(in srgb,var(--danger) 16%,transparent);color:var(--danger)}
.msf-row-ico--ok{background:color-mix(in srgb,var(--success) 16%,transparent);color:var(--success)}
.msf-row-ico--muted{background:var(--bg);color:var(--text2)}
.msf-row-txt{flex:1;min-width:0}
.msf-row-txt b{display:block;font-size:13.5px;font-weight:700;letter-spacing:-.15px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msf-row-txt span{display:block;font-size:11px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msf-row-n{font-size:17px;font-weight:800;font-family:ui-monospace,'Cascadia Code',monospace;
  font-variant-numeric:tabular-nums}

.msf-sect{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:2px 2px 8px}
.msf-sect b{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.msf-sect button{background:none;border:0;padding:0;cursor:pointer;font:600 11.5px/1 inherit;color:var(--accent)}

.msf-chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}
.msf-chips::-webkit-scrollbar{display:none}
.msf-chip{flex:0 0 auto;height:34px;display:inline-flex;align-items:center;gap:6px;padding:0 13px;
  border-radius:17px;border:1px solid var(--border);background:var(--card);color:var(--text2);
  font:600 12.5px/1 inherit;white-space:nowrap;cursor:pointer}
.msf-chip--on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent);font-weight:700}

.msf-seg{display:flex;gap:4px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:4px}
.msf-seg button{flex:1;height:38px;border:0;border-radius:9px;background:transparent;color:var(--muted);
  font:600 13px/1 inherit;display:flex;align-items:center;justify-content:center;gap:6px;
  white-space:nowrap;cursor:pointer}
.msf-seg button.msf-seg-on{background:var(--accent-bg);color:var(--accent);font-weight:700}

.msf-badge{display:inline-flex;align-items:center;font-size:10px;font-weight:800;letter-spacing:.04em;
  text-transform:uppercase;border-radius:5px;padding:2px 6px;white-space:nowrap;
  border:1px solid var(--border);color:var(--muted);background:transparent}
.msf-badge--accent{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.msf-badge--ok{background:color-mix(in srgb,var(--success) 16%,transparent);
  border-color:color-mix(in srgb,var(--success) 45%,transparent);color:var(--success)}
.msf-badge--warn{background:color-mix(in srgb,var(--warn) 16%,transparent);
  border-color:color-mix(in srgb,var(--warn) 45%,transparent);color:var(--warn)}
.msf-badge--danger{background:color-mix(in srgb,var(--danger) 16%,transparent);
  border-color:color-mix(in srgb,var(--danger) 45%,transparent);color:var(--danger)}

.msf-btn{height:50px;padding:0 20px;border-radius:10px;border:0;cursor:pointer;
  background:var(--accent);color:#ffffff;font:800 14.5px/1 inherit;letter-spacing:-.1px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px}
.msf-btn--sm{height:44px;font-size:13.5px}
.msf-btn--block{width:100%}
.msf-btn--ghost{background:var(--card);border:1px solid var(--border);color:var(--text2);font-weight:700}
.msf-btn--danger{background:var(--danger);color:#ffffff}
.msf-icon-btn{width:44px;height:44px;flex:0 0 44px;border-radius:10px;border:1px solid var(--border);
  background:var(--card);color:var(--text2);display:inline-flex;align-items:center;
  justify-content:center;cursor:pointer;position:relative}
.msf-icon-btn--on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.msf-card .msf-btn--ghost,.msf-card .msf-icon-btn,
.msf-bs .msf-btn--ghost,.msf-bs .msf-icon-btn,
.msf-rows .msf-btn--ghost,.msf-rows .msf-icon-btn{background:var(--bg)}

.msf-fab{position:absolute;right:16px;bottom:22px;z-index:30;
  width:54px;height:54px;border-radius:50%;border:0;cursor:pointer;
  background:var(--accent);color:#ffffff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 34%,transparent)}

.msf-gauge{height:5px;border-radius:3px;background:var(--border);overflow:hidden;width:74px;flex:0 0 74px}
.msf-gauge i{display:block;height:100%;background:var(--accent);border-radius:3px}

.msf-dl{display:grid;grid-template-columns:1fr 1fr;gap:11px 14px;margin:0}
.msf-dl>div{min-width:0}
.msf-dl dt{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);margin-bottom:2px}
.msf-dl dd{margin:0;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.msf-dl .msf-dl-full{grid-column:1/-1}

.msf-empty{padding:26px 12px;text-align:center;color:var(--muted);font-size:12.5px}

/* Feuille remontante, contrainte au cadre du téléphone. */
.msf-bs-backdrop{position:absolute;inset:0;z-index:70;background:color-mix(in srgb,var(--bg) 62%,transparent)}
.msf-bs{position:absolute;left:0;right:0;bottom:0;z-index:80;background:var(--card);
  border-top:1px solid var(--border);border-radius:16px 16px 0 0;
  display:flex;flex-direction:column;max-height:78%;
  box-shadow:0 -18px 50px color-mix(in srgb,var(--bg) 55%,transparent)}
.msf-bs-grab{width:40px;height:4px;border-radius:2px;background:var(--border);margin:9px auto 4px;flex:0 0 auto}
.msf-bs-head{padding:6px 16px 12px;border-bottom:1px solid var(--border);flex:0 0 auto;
  font-size:14.5px;font-weight:800}
.msf-bs-body{padding:14px 16px;overflow-y:auto;flex:1;min-height:0}
.msf-bs-foot{flex:0 0 auto;display:flex;gap:8px;align-items:center;padding:11px 14px;
  border-top:1px solid var(--border)}

/* ══════════════════════════════════════════════════════════════════════
   Composants mobiles nouveaux — proposés par cette maquette
   Préfixe .msf- pour rejoindre le socle partagé.
   ══════════════════════════════════════════════════════════════════════ */

/* Topbar mobile existante (.mobile-topbar) */
.msf-topbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;
  height:54px;padding:0 8px 0 6px;background:var(--card);border-bottom:1px solid var(--border);
}
.msf-topbar-t{flex:1;min-width:0}
.msf-topbar-t b{display:block;font-size:15px;font-weight:800;letter-spacing:-.3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msf-topbar-t span{display:block;font-size:11px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msf-tb-btn{width:40px;height:40px;flex:0 0 40px;border-radius:10px;border:0;background:transparent;
  color:var(--text2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}

/* Barre de recherche collante sous la topbar */
.msf-searchbar{position:sticky;top:54px;z-index:19;display:flex;gap:8px;align-items:center;
  padding:9px 12px;background:var(--bg);border-bottom:1px solid var(--border)}
.msf-search{flex:1;min-width:0;height:44px;display:flex;align-items:center;gap:8px;
  padding:0 12px;border-radius:11px;border:1px solid var(--border);background:var(--filter-input-bg);
  color:var(--muted);font-size:13.5px}
.msf-filtres-btn{position:relative}
.msf-filtres-btn .msf-pastille{position:absolute;top:6px;right:6px;width:8px;height:8px;
  border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--card)}

/* Bandeau de contexte collant (fiche : ce qu'on regarde ne doit pas sortir de l'écran) */
.msf-ctx{position:sticky;top:54px;z-index:18;padding:10px 12px;background:var(--bg);
  border-bottom:1px solid var(--border)}
.msf-ctx-l1{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.msf-ctx-l1 b{font-size:15px;font-weight:800;letter-spacing:-.3px}
.msf-ctx-l2{font-size:11.5px;color:var(--muted);line-height:1.45}

/* Onglets défilants (remplace les onglets bureau qui se chevauchent) */
.msf-tabs{position:sticky;top:54px;z-index:18;display:flex;gap:2px;overflow-x:auto;
  scrollbar-width:none;background:var(--bg);border-bottom:1px solid var(--border);padding:0 8px}
.msf-tabs::-webkit-scrollbar{display:none}
.msf-tabs button{flex:0 0 auto;height:46px;padding:0 13px;border:0;background:transparent;
  color:var(--muted);font:600 13px/1 inherit;cursor:pointer;position:relative;
  display:inline-flex;align-items:center;gap:6px}
.msf-tabs button.on{color:var(--accent);font-weight:800}
.msf-tabs button.on::after{content:'';position:absolute;left:10px;right:10px;bottom:0;height:2.5px;
  background:var(--accent);border-radius:2px 2px 0 0}
.msf-tab-n{min-width:19px;height:18px;padding:0 5px;border-radius:9px;background:var(--bg);
  border:1px solid var(--border);color:var(--muted);font:700 10px/16px ui-monospace,monospace;text-align:center}
.msf-tab-n--alert{background:var(--danger);border-color:transparent;color:#ffffff}

/* Corps de page */
.msf-body{padding:12px}
.msf-body--pad{padding-bottom:96px}

/* Ligne libellé / valeur, pleine largeur (remplace une ligne de tableau) */
.msf-kv{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.msf-kv:last-child{border-bottom:0}
.msf-kv dt{color:var(--muted);font-size:12px;flex:0 0 auto}
.msf-kv dd{margin:0;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;min-width:0}
.msf-kv--fort dd{font-size:16px;font-weight:800}
.msf-kv--tot{border-top:1px solid var(--border);border-bottom:0;margin-top:4px;padding-top:11px}

/* Champ de saisie mobile plein format */
.msf-field{margin-bottom:12px}
.msf-field label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.msf-input{width:100%;height:48px;padding:0 13px;border-radius:11px;border:1px solid var(--border);
  background:var(--bg);color:var(--text);font:600 15px/1 inherit;display:flex;align-items:center;
  justify-content:space-between;gap:8px}
.msf-input--txt{font-weight:500;color:var(--text2)}
.msf-input em{font-style:normal;font-size:12px;color:var(--muted);font-weight:600}
.msf-field-hint{margin:5px 2px 0;font-size:11px;line-height:1.5;color:var(--muted)}
.msf-card .msf-input{background:var(--bg)}

/* Saisie de prix en place : le geste central de Coûts matières */
.msf-prix{display:flex;align-items:center;gap:8px;height:46px;padding:0 10px 0 12px;
  border-radius:11px;border:1px solid var(--border);background:var(--bg)}
.msf-prix--focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.msf-prix--ok{border-color:var(--success)}
.msf-prix i{flex:0 0 auto;color:var(--muted);display:inline-flex}
.msf-prix b{flex:1;font:800 18px/1 ui-monospace,'Cascadia Code',monospace;
  font-variant-numeric:tabular-nums;letter-spacing:-.4px}
.msf-prix span{flex:0 0 auto;font-size:11.5px;color:var(--muted);font-weight:600}
.msf-prix-etat{font-size:11px;font-weight:700;color:var(--success);display:inline-flex;align-items:center;gap:4px}
.msf-prix-lock{display:flex;align-items:center;gap:8px;height:46px;padding:0 12px;border-radius:11px;
  border:1px dashed var(--border);background:transparent;color:var(--muted);font-size:12.5px}

/* Barre d'action collante en bas (le geste principal reste sous le pouce) */
.msf-actionbar{position:sticky;bottom:0;z-index:25;display:flex;gap:8px;align-items:center;
  padding:10px 12px;background:var(--card);border-top:1px solid var(--border)}
.msf-actionbar .msf-btn{flex:1}

/* Accordéon de section pour les formulaires longs */
.msf-acc{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.msf-acc + .msf-acc{margin-top:9px}
.msf-acc-h{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:10px 13px;
  border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.msf-acc-h b{flex:1;min-width:0;font-size:13.5px;font-weight:800;letter-spacing:-.15px}
.msf-acc-h .msf-acc-sum{font-size:11.5px;color:var(--muted);font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.msf-acc-b{padding:2px 13px 14px;border-top:1px solid var(--border)}
.msf-acc-sous{font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
  color:var(--text2);margin:14px 0 8px}
.msf-acc-sous:first-child{margin-top:12px}

/* Carte de comparaison d'offre (Demandes de prix) */
.msf-offre{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.msf-offre + .msf-offre{margin-top:9px}
.msf-offre--best{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.msf-offre-h{display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;
  border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.msf-offre-rang{width:26px;height:26px;flex:0 0 26px;border-radius:8px;background:var(--bg);
  color:var(--muted);font:800 12px/26px ui-monospace,monospace;text-align:center}
.msf-offre--best .msf-offre-rang{background:var(--accent);color:#ffffff}
.msf-offre-id{flex:1;min-width:0}
.msf-offre-id b{display:block;font-size:13.5px;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msf-offre-id span{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.msf-offre-prix{text-align:right;flex:0 0 auto}
.msf-offre-prix b{display:block;font:800 17px/1.1 ui-monospace,'Cascadia Code',monospace;
  font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.msf-offre--best .msf-offre-prix b{color:var(--accent)}
.msf-offre-prix span{display:block;font-size:10px;color:var(--muted);margin-top:3px;
  text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.msf-offre-b{padding:0 12px 12px;border-top:1px solid var(--border)}
.msf-ecart{font-size:11px;font-weight:700;color:var(--warn)}
.msf-ecart--ok{color:var(--success)}

/* Chaîne de calcul : la suite d'opérations, une ligne par terme */
.msf-calc{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:var(--bg);
  border:1px solid var(--border)}
.msf-calc-t{font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);margin-bottom:6px}
.msf-calc .msf-kv{border-bottom-color:color-mix(in srgb,var(--border) 60%,transparent);font-size:12.5px}

/* Jauge de composition (coût produit) */
.msf-parts{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--border);margin:10px 0 8px}
.msf-parts i{display:block;height:100%}
.msf-leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--text2)}
.msf-leg span{display:inline-flex;align-items:center;gap:6px}
.msf-leg i{width:9px;height:9px;border-radius:3px;flex:0 0 9px}

/* Fil de messagerie */
.msf-msg{max-width:84%;padding:9px 12px;border-radius:13px;font-size:13px;line-height:1.5}
.msf-msg--eux{background:var(--card);border:1px solid var(--border);border-bottom-left-radius:4px}
.msf-msg--nous{background:var(--accent-bg);border:1px solid var(--accent);color:var(--text);
  margin-left:auto;border-bottom-right-radius:4px}
.msf-msg-meta{font-size:10px;color:var(--muted);margin-top:4px;font-weight:600}
.msf-composer{position:sticky;bottom:0;display:flex;gap:8px;align-items:center;padding:10px 12px;
  background:var(--card);border-top:1px solid var(--border)}
.msf-composer .msf-input{flex:1;height:44px}

/* Pas à pas (création) */
.msf-steps{display:flex;align-items:center;gap:6px;padding:10px 12px;background:var(--bg);
  border-bottom:1px solid var(--border);position:sticky;top:54px;z-index:18}
.msf-step{flex:1;height:4px;border-radius:2px;background:var(--border)}
.msf-step.on{background:var(--accent)}
.msf-step-lbl{font-size:11px;color:var(--muted);font-weight:700;flex:0 0 auto}

.msf-muted{color:var(--muted)}
.msf-num{font-family:ui-monospace,'Cascadia Code',monospace;font-variant-numeric:tabular-nums}
</style>
</head>

/* ── Rendu ──────────────────────────────────────────────────────────── */
function rendreToc(){
  var groupes = {}, ordre = [];
  Object.keys(ECRANS).forEach(function(k){
    var g = ECRANS[k].app;
    if (!groupes[g]) { groupes[g] = []; ordre.push(g); }
    groupes[g].push(k);
  });
  document.getElementById('toc').innerHTML = ordre.map(function(g){
    return '<h3>'+esc(g)+'</h3>'+groupes[g].map(function(k){
      var e = ECRANS[k];
      return '<button data-go="'+k+'" class="'+(S.ecran===k?'on':'')+'">'+esc(e.t)+
        '<em>'+esc(e.r)+'</em></button>';
    }).join('');
  }).join('');
}

function rendre(){
  var e = ECRANS[S.ecran];
  var html = e.f();
  if (S.sheet && SHEETS[S.sheet]){
    var s = SHEETS[S.sheet];
    html += '<div class="msf-bs-backdrop" data-close></div>'+
      '<div class="msf-bs"><div class="msf-bs-grab"></div>'+
      '<div class="msf-bs-head">'+esc(s.t)+'</div>'+
      '<div class="msf-bs-body">'+s.b+'</div>'+
      '<div class="msf-bs-foot">'+s.f+'</div></div>';
  }
  document.getElementById('screen').innerHTML = html;
  document.getElementById('notes').innerHTML =
    '<h2>'+esc(e.t)+'</h2><div class="mq-route">'+esc(e.r)+'</div>'+
    e.notes.map(function(n){
      return '<div class="mq-note"><b>'+esc(n[0])+'</b><p>'+n[1]+'</p></div>'; }).join('');
  rendreToc();
}

document.addEventListener('click', function(ev){
  var t = ev.target.closest('[data-theme]');
  if (t){
    S.theme = t.getAttribute('data-theme');
    document.body.classList.toggle('light', S.theme === 'light');
    Array.prototype.forEach.call(document.querySelectorAll('#tgl-theme button'), function(b){
      b.classList.toggle('on', b === t); });
    return;
  }
  if (ev.target.closest('[data-close]')){ S.sheet = null; rendre(); return; }
  var sh = ev.target.closest('[data-sheet]');
  if (sh){ S.sheet = sh.getAttribute('data-sheet'); rendre(); return; }
  var go = ev.target.closest('[data-go]');
  if (go){
    var k = go.getAttribute('data-go');
    if (ECRANS[k]){ S.ecran = k; S.sheet = null;
      if (k === 'ao-detail') S.onglet = 'lignes';
      document.getElementById('screen').scrollTop = 0; rendre(); }
    return;
  }
  var tab = ev.target.closest('[data-tab]');
  if (tab){
    S.onglet = tab.getAttribute('data-tab');
    S.ecran = (S.onglet === 'prix') ? 'ao-prix' : 'ao-detail';
    document.getElementById('screen').scrollTop = 0; rendre(); return;
  }
  var tg = ev.target.closest('[data-toggle]');
  if (tg){
    var id = tg.getAttribute('data-toggle');
    S.ouvert[id] = !S.ouvert[id];
    var pos = document.getElementById('screen').scrollTop;
    rendre();
    document.getElementById('screen').scrollTop = pos;
  }
});

S.ouvert['o0'] = true;   // une offre dépliée d'emblée : la chaîne de calcul est le sujet
S.ouvert['a2'] = true;   // la fiche technique ouverte : c'est la section la plus dense
S.ouvert['p0'] = true;   // un produit déplié : la jauge de composition est le sujet
rendre();
})();
</script>
